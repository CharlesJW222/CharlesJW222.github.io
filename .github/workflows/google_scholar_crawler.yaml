name: Get Citation Data

on:
  workflow_dispatch:
# Daily updates run on the website owner's server because Scholar rate-limits
# GitHub-hosted runners. This workflow remains available for manual runs.

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Fetch citation data
        working-directory: google_scholar_crawler
        run: python main.py
        env:
          GOOGLE_SCHOLAR_ID: lpql_8kAAAAJ
      - name: Publish citation data
        run: |
          cp google_scholar_crawler/results/gs_data*.json "$RUNNER_TEMP/"
          if git ls-remote --exit-code --heads origin google-scholar-stats > /dev/null; then
            git fetch origin google-scholar-stats
            git switch -C google-scholar-stats FETCH_HEAD
          else
            git switch --orphan google-scholar-stats
          fi
          cp "$RUNNER_TEMP"/gs_data*.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Google Scholar citation data"
            git push origin HEAD:google-scholar-stats
          fi
